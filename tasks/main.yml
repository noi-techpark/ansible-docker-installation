---
- name: Update the server
  apt:
    upgrade: safe
    update_cache: yes

- name: Install required system packages
  apt:
    name: '{{ item }}'
    state: latest
  loop:
    - apt-transport-https
    - ca-certificates
    - curl
    - gpg
    - python3-pip
    - virtualenv
    - python3-setuptools
    - python3-docker
    - unzip
    - libffi-dev

- name: Create keyrings directory
  file:
    dest: /etc/apt/keyrings
    state: directory
    mode: 0755

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: 0644

- name: Add Docker Repository
  apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Update apt and install docker-ce
  apt:
    name: docker-ce
    state: latest
    update_cache: yes

- name: Install docker-compose-plugin V2
  apt:
    name: docker-compose-plugin
    state: latest

- name: Adjust Docker logging strategy
  copy:
    src: daemon.json
    dest: /etc/docker/daemon.json

- name: Restart the Docker daemon
  service:
    name: docker
    state: restarted

- name: Create /var/docker folder
  file:
    dest: /var/docker
    state: directory
    owner: root
    group: docker
    mode: 0774

- name: Copy health check script
  copy:
    src: healthchecks.py
    dest: /var/docker/healthchecks.py
